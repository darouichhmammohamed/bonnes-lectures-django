{% extends 'mainapp/base.html' %}

{% block title %}Supprimer le livre{% endblock %}

{% block content %}

<h1>Supprimer le livre</h1>

<p>Voulez-vous vraiment supprimer le livre « {{ book.title }} » ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirmer la suppression</button>
</form>

<a href="{% url 'book' book.id %}">Annuler</a>

{% endblock %}
