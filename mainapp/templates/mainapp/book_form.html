
{% extends 'mainapp/base.html' %}
{% load django_bootstrap5 %}

{% block title %}Formulaire du livre{% endblock %}

{% block content %}
<h1>Ajouter un livre</h1>

<form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Enregistrer" %}
</form>

<a href="{% url 'books' %}" class="btn btn-secondary mt-2">
    Annuler
</a>
{% endblock %}
