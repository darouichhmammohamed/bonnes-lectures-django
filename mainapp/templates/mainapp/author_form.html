{% extends 'mainapp/base.html' %}
{% load django_bootstrap5 %}

{% block title %}Formulaire auteur{% endblock %}

{% block content %}
    <h1>Formulaire auteur</h1>

    <form method="post">
        {% csrf_token %}

        {% bootstrap_form form %}

        {% bootstrap_button button_type="submit" content="Enregistrer" %}
    </form>

    <a href="{% url 'authors' %}">Annuler</a>
{% endblock %}
